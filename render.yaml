services:
  - type: web
    name: pipelined-intruder-detection
    runtime: node
    plan: free
    region: oregon
    buildCommand: cd server && npm install --include=dev && cd ../client && npm install --include=dev && npm run build && cd ../server && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
